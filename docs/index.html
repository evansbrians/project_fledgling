.field-label {

  <script>
// Oxbow field-use map — vanilla Leaflet, data from data.js (window.*)
(function () {
  "use strict";

  // YlOrRd sequential ramp for prop_use
  var RAMP = ["#ffffcc","#ffeda0","#fed976","#feb24c","#fd8d3c","#fc4e2a","#e31a1c","#b10026"];
  function hex(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}
  var RGB = RAMP.map(hex);
  function ramp(t){ // t in [0,1] -> css rgb
    if (!(t > 0)) return "#f3f3f1";           // no/zero use -> neutral grey
    t = Math.min(Math.max(t, 0), 1);
    var x = t * (RGB.length - 1), i = Math.floor(x), f = x - i;
    if (i >= RGB.length - 1) return "rgb(" + RGB[RGB.length-1].join(",") + ")";
    var a = RGB[i], b = RGB[i+1];
    return "rgb(" + Math.round(a[0]+f*(b[0]-a[0])) + "," +
                    Math.round(a[1]+f*(b[1]-a[1])) + "," +
                    Math.round(a[2]+f*(b[2]-a[2])) + ")";
  }

  document.addEventListener("DOMContentLoaded", function () {
    var map = L.map("map", { zoomControl: true, preferCanvas: false });

    // panes: fields below, KDE above fields, labels (tooltipPane 650) above all
    map.createPane("fieldsPane"); map.getPane("fieldsPane").style.zIndex = 410;
    map.createPane("kdePane");    map.getPane("kdePane").style.zIndex = 450;

    var sat = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { attribution: "Esri", maxZoom: 22 });
    var light = L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      { attribution: "CARTO", maxZoom: 22 });
    sat.addTo(map);

    var fields50 = L.layerGroup().addTo(map);   // default on
    var fields95 = L.layerGroup();               // default off
    var kde = L.imageOverlay("", [[0,0],[0,0]], { pane: "kdePane", opacity: 1 }); // default off

    L.control.layers(
      { "Satellite": sat, "Light": light },
      { "Fields — 50%": fields50, "Fields — 95%": fields95, "KDE (95%)": kde },
      { collapsed: false, position: "topright" }
    ).addTo(map);

    // legend
    var legend = L.control({ position: "bottomright" });
    legend.onAdd = function () { this._div = L.DomUtil.create("div", "legend"); return this._div; };
    legend.addTo(map);
    var grad = "linear-gradient(to right," + RAMP.join(",") + ")";
    function setLegend(maxv) {
      legend._div.innerHTML =
        '<div class="title">prop_use</div>' +
        '<div class="bar" style="background:' + grad + '"></div>' +
        '<div class="ends"><span>0.00</span><span>' + maxv.toFixed(2) + "</span></div>";
    }

    var fieldsBounds = L.geoJSON(window.FIELDS).getBounds();
    map.fitBounds(fieldsBounds, { padding: [20, 20] });

    function drawLevel(group, useObj, maxv) {
      group.clearLayers();
      var gl = L.geoJSON(window.FIELDS, {
        pane: "fieldsPane",
        style: function (feat) {
          var v = useObj[feat.properties.field_name] || 0;
          return { fillColor: ramp(maxv > 0 ? v / maxv : 0), color: "#ffffff",
                   weight: 1, fillOpacity: 0.75 };
        },
        onEachFeature: function (feat, layer) {
          var v = useObj[feat.properties.field_name] || 0;
          layer.bindTooltip(v.toFixed(2),
            { permanent: true, direction: "center", className: "field-label", opacity: 1 });
          layer.bindPopup("<b>" + feat.properties.field_name + "</b><br>prop_use: " + v.toFixed(2));
        }
      });
      group.addLayer(gl);
    }

    function render(tag, day) {
      var byDay = (window.USE[tag] || {})[day] || {};
      var u50 = byDay["50"] || {}, u95 = byDay["95"] || {};
      var maxv = 0;
      Object.keys(u50).forEach(function (k){ if (u50[k] > maxv) maxv = u50[k]; });
      Object.keys(u95).forEach(function (k){ if (u95[k] > maxv) maxv = u95[k]; });
      if (maxv <= 0) maxv = 1;

      drawLevel(fields50, u50, maxv);
      drawLevel(fields95, u95, maxv);
      setLegend(maxv);

      var b = (window.KDE_BOUNDS[tag] || {})[day];
      if (b) { kde.setBounds(b); kde.setUrl("kde/" + tag + "/" + tag + "_" + day + ".png"); }
      else { kde.setUrl(""); }
    }

    // cascading dropdowns
    var selSpecies = document.getElementById("species");
    var selTag = document.getElementById("tag");
    var selDay = document.getElementById("day");
    function fill(sel, items) {
      sel.innerHTML = "";
      items.forEach(function (v) {
        var o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o);
      });
    }

    Object.keys(window.SPECIES_TAGS).forEach(function (sp) {
      var o = document.createElement("option"); o.value = sp; o.textContent = sp; selSpecies.appendChild(o);
    });

    function onSpecies() { fill(selTag, window.SPECIES_TAGS[selSpecies.value]); onTag(); }
    function onTag() { fill(selDay, window.TAG_DAYS[selTag.value]); onDay(); }
    function onDay() { render(selTag.value, selDay.value); }

    selSpecies.addEventListener("change", onSpecies);
    selTag.addEventListener("change", onTag);
    selDay.addEventListener("change", onDay);

    onSpecies(); // initialise
  });
})();
